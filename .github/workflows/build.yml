name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Testes e APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TitanLauncher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TitanLauncher
          path: TitanLauncher.apk
      # Todo push na main publica uma Release nova com o APK.
      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Titan Launcher v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: TitanLauncher.apk
